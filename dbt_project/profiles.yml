greenandcoop_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST') }}"
      user: "{{ env_var('PGUSER') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('PGDATABASE') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
    prod_rds:
      type: postgres
      host: "{{ env_var('AWS_RDS_ENDPOINT') }}"
      user: "{{ env_var('AWS_RDS_USER') }}"
      password: "{{ env_var('AWS_RDS_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('AWS_RDS_DB') }}"
      schema: public
      threads: 4